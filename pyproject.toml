[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "offlinemedia"
version = "0.1.0"
description = "Offline Windows AI video generation workstation"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "httpx>=0.27,<1",
]

[project.scripts]
offlinemedia = "app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
